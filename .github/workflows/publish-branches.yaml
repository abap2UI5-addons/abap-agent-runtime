name: publish-branches

# abapGit always pulls a whole repository, and the two HTTP entry classes
# cannot both activate on one system: if_http_extension (package 03) does
# not exist in ABAP Cloud, if_http_service_extension (package 04) not on
# ABAP Standard 7.50 and older. So every push to main regenerates two
# branches:
#   standard - main without package 04 (ABAP Standard, on-premise)
#   cloud    - main without package 03 (ABAP Cloud: BTP ABAP environment,
#              S/4HANA Cloud Public Edition)
# Install from one of them - README.md, "Install". Never commit to them.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Two jobs: npm ci and abaplint run third-party code, and anything run in a
# job can tamper with its later steps ($GITHUB_ENV, $GITHUB_PATH, the files
# they run) - --ignore-scripts would stop the install scripts, not abaplint
# itself. So `lint` has a read-only token and nothing to push with, and
# `publish`, the only job with contents: write, runs no npm and nothing of
# the repository: a fresh checkout of the same commit, `git rm`, the push.
# Neither branch moves unless both lint.

permissions:
  contents: read

concurrency:
  group: publish-branches
  cancel-in-progress: false

jobs:
  # the branch must activate on its target - lint it there first
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - branch: standard
            config: ./abaplint.jsonc
          - branch: cloud
            config: .github/abaplint/abap_cloud.jsonc
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '22'
        cache: 'npm'
    - run: npm ci
    - name: Lint the target (${{ matrix.branch }})
      run: npx abaplint ${{ matrix.config }}

  publish:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    strategy:
      max-parallel: 1
      matrix:
        include:
          - branch: standard
            remove: src/04
          - branch: cloud
            remove: src/03
    steps:
    # no credential in .git/config - the push step takes the token in its
    # own env
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Remove the other entry package
      run: git rm -r -q ${{ matrix.remove }}
    - name: Commit and push
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git commit -q -m "generate ${{ matrix.branch }} from ${GITHUB_SHA}"
        # the header actions/checkout would have persisted, for this push only
        # (through the environment, not the command line)
        GIT_CONFIG_COUNT=1 \
        GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
        GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" \
          git push --force origin HEAD:${{ matrix.branch }}
